<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DS Generator — Authentication</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</head>
<body>

<canvas id="premium-3d-data-canvas"></canvas>

<div class="overlay"></div>

<div class="top-bar">
    <button class="top-btn" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
    </button>
</div>

<div class="auth-container">
    <div class="auth-card" id="authCard">

        <div class="auth-logo">
            <i class="fas fa-chart-simple logo-icon"></i>
            <h1 class="logo-title" data-i18n="auth_title">DS Generator</h1>
            <p class="logo-sub" data-i18n="auth_subtitle">Statistik Deskriptif &bull; Wawasan Auto-EDA</p>
        </div>

        <div class="toggle-pill">
            <button class="pill-btn active" data-tab="signin" id="tabSignin" data-i18n="auth_signin_tab">Masuk</button>
            <button class="pill-btn" data-tab="register" id="tabRegister" data-i18n="auth_register_tab">Daftar</button>
        </div>

        <div class="form-wrapper">
            <div class="form-panel active" id="panelSignin">
                <form id="formSignin" autocomplete="off" novalidate>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="auth-input" id="loginUsername" data-i18n-placeholder="auth_username_ph" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="loginPassword" data-i18n-placeholder="auth_password_ph" placeholder="Password" required>
                        <button type="button" class="toggle-pass" aria-label="Toggle password">
                            <i class="far fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="check-text" data-i18n="auth_remember">Remember me</span>
                        </label>
                        <a href="#" class="forgot-link" data-i18n="auth_or">Forgot password?</a>
                    </div>
                    <button type="submit" class="btn-submit" id="btnSignin">
                        <span class="btn-text" data-i18n="auth_signin_btn">Sign In</span>
                        <i class="fas fa-arrow-right btn-icon"></i>
                        <div class="spinner hidden"></div>
                    </button>
                </form>
                <p class="switch-text">
                    <span data-i18n="auth_no_account">Don't have an account?</span>
                    <a href="#" class="switch-link" data-tab="register" data-i18n="auth_register_tab">Register</a>
                </p>
            </div>

            <div class="form-panel" id="panelRegister">
                <form id="formRegister" autocomplete="off" novalidate>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="auth-input" id="regUsername" data-i18n-placeholder="auth_username_ph" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="auth-input" id="regEmail" data-i18n-placeholder="auth_email_ph" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="regPassword" data-i18n-placeholder="auth_regpass_ph" placeholder="Password" required>
                        <button type="button" class="toggle-pass" aria-label="Toggle password">
                            <i class="far fa-eye"></i>
                        </button>
                        <div class="password-strength hidden" id="strengthBar">
                            <div class="strength-track">
                                <div class="strength-fill" id="strengthFill"></div>
                            </div>
                            <span class="strength-label" id="strengthLabel">Weak</span>
                        </div>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="auth-input" id="regConfirm" data-i18n-placeholder="auth_confirm_ph" placeholder="Confirm your password" required>
                        <button type="button" class="toggle-pass" aria-label="Toggle password">
                            <i class="far fa-eye"></i>
                        </button>
                        <span class="confirm-status" id="confirmStatus"></span>
                    </div>
                    <button type="submit" class="btn-submit" id="btnRegister">
                        <span class="btn-text" data-i18n="auth_register_btn">Create Account</span>
                        <i class="fas fa-rocket btn-icon"></i>
                        <div class="spinner hidden"></div>
                    </button>
                </form>
                <p class="switch-text">
                    <span data-i18n="auth_have_account">Already have an account?</span>
                    <a href="#" class="switch-link" data-tab="signin" data-i18n="auth_signin_tab">Sign In</a>
                </p>
            </div>
        </div>

        <div class="auth-footer">
            <span data-i18n="auth_footer">The Architects — ITSB</span>
        </div>
    </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
